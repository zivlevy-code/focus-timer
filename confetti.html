<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Confetti</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), parts = [], raf = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS = ['#F2B134', '#E4572E', '#3C7DD9', '#2FA97C', '#E36AA6', '#8E6CEF'];
  function size() {
    var d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', size); size();

  // Shot from the bottom corners (and the middle, for the big one) across the whole screen.
  function burst(big) {
    var k = Math.min(2.2, Math.max(1, innerHeight / 800));
    var n = (big ? 240 : 140) * (reduce ? 0.3 : 1);
    var spots = big ? [0.1, 0.5, 0.9] : [0.1, 0.9];
    for (var i = 0; i < n; i++) {
      var f = spots[i % spots.length];
      var dir = f < 0.4 ? 1 : f > 0.6 ? -1 : (Math.random() < 0.5 ? 1 : -1);
      parts.push({
        x: innerWidth * f, y: innerHeight * 0.95,
        vx: dir * (2 + Math.random() * 8) * k + (Math.random() - 0.5) * 3,
        vy: -(11 + Math.random() * 13) * k,
        g: 0.38 * k,
        s: 7 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
        c: COLORS[(Math.random() * COLORS.length) | 0], life: 0, round: Math.random() < 0.3
      });
    }
    if (!raf) raf = requestAnimationFrame(frame);
  }

  function frame() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(function (p) { return p.y < innerHeight + 30 && p.life < 300; });
    parts.forEach(function (p) {
      p.life++; p.vy += p.g; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      cx.globalAlpha = Math.max(0, 1 - p.life / 300);
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 6.28); cx.fill(); }
      else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cx.restore();
    });
    raf = parts.length ? requestAnimationFrame(frame) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }

  if (window.confettiApp) window.confettiApp.onBurst(burst);
})();
</script>
</body>
</html>
