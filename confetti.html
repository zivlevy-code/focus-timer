<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Screen effects</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* A big message in the middle of every screen (distraction warning, squashed tomato, break reminder). */
  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
    transition: opacity .35s ease, transform .45s cubic-bezier(.2, 1.5, .4, 1);
    background: rgba(18, 22, 30, .93); color: #fff; border: 5px solid #E5402B; border-radius: 32px;
    padding: 30px 48px 34px; text-align: center; max-width: 80vw; box-shadow: 0 24px 70px rgba(0, 0, 0, .5);
    font-family: "Segoe UI", "Assistant", Arial, sans-serif; }
  #msg.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #msg.calm { border-color: #2FA97C; }
  #msg.low { top: 84%; }
  #msg .ico { font-size: 110px; line-height: 1.1; display: inline-block; }
  #msg.show .ico { animation: wobble .6s ease-in-out 3; }
  #msg.wilt .ico { filter: grayscale(.85); transform: rotate(28deg); }
  #msg.show.wilt .ico { animation: droop 1.6s ease-in-out infinite; }
  #msg .t { font-size: 40px; font-weight: 800; margin-top: 8px; }
  #msg .sub { font-size: 22px; opacity: .85; margin-top: 10px; }
  @keyframes wobble { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
  @keyframes droop { 0%, 100% { transform: rotate(22deg); } 50% { transform: rotate(34deg) translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { #msg, #msg .ico { animation: none !important; transition: opacity .2s; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg" aria-live="assertive"><span class="ico"></span><div class="t"></div><div class="sub"></div></div>
<script>
(function () {
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), raf = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var confetti = [], tomatoes = [], flights = [], splats = [];
  var raining = false, spawnTimer = 0, ac = null;
  var COLORS = ['#F2B134', '#E4572E', '#3C7DD9', '#2FA97C', '#E36AA6', '#8E6CEF'];
  var Kc = 1, Kt = 1;
  function size() {
    var d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
    Kc = Math.min(2.2, Math.max(1, innerHeight / 800));
    Kt = Math.min(1.8, Math.max(1, innerHeight / 900));
  }
  addEventListener('resize', size); size();
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  /* ---------- confetti: from the bottom corners, and the middle for the big one ---------- */
  function burst(big) {
    var n = (big ? 240 : 140) * (reduce ? 0.3 : 1);
    var spots = big ? [0.1, 0.5, 0.9] : [0.1, 0.9];
    for (var i = 0; i < n; i++) {
      var f = spots[i % spots.length];
      var dir = f < 0.4 ? 1 : f > 0.6 ? -1 : (Math.random() < 0.5 ? 1 : -1);
      confetti.push({
        x: innerWidth * f, y: innerHeight * 0.95,
        vx: dir * (2 + Math.random() * 8) * Kc + (Math.random() - 0.5) * 3,
        vy: -(11 + Math.random() * 13) * Kc, g: 0.38 * Kc,
        s: 7 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
        c: COLORS[(Math.random() * COLORS.length) | 0], life: 0, round: Math.random() < 0.3
      });
    }
    kick();
  }
  function drawConfetti() {
    confetti = confetti.filter(function (p) { return p.y < innerHeight + 30 && p.life < 300; });
    confetti.forEach(function (p) {
      p.life++; p.vy += p.g; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      cx.globalAlpha = Math.max(0, 1 - p.life / 300);
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 6.28); cx.fill(); }
      else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cx.restore();
    });
  }

  /* ---------- a tomato ---------- */
  function drawTomato(s) {
    cx.fillStyle = '#E5402B';
    cx.beginPath(); cx.ellipse(0, s * 0.12, s * 0.5, s * 0.43, 0, 0, 6.28); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,0.35)';
    cx.beginPath(); cx.ellipse(-s * 0.2, -s * 0.02, s * 0.11, s * 0.06, -0.6, 0, 6.28); cx.fill();
    cx.fillStyle = '#3E8E41';
    cx.save(); cx.translate(0, -s * 0.24);
    for (var k = 0; k < 5; k++) {
      cx.beginPath(); cx.ellipse(0, -s * 0.09, s * 0.05, s * 0.14, 0, 0, 6.28); cx.fill();
      cx.rotate(1.2566);
    }
    cx.restore();
    cx.fillStyle = '#2D6B30';
    cx.fillRect(-s * 0.03, -s * 0.46, s * 0.06, s * 0.2);
  }

  /* ---------- tomato rain, for as long as the break lasts ---------- */
  function spawnTomato(spread) {
    var s = (24 + Math.random() * 28) * Kt;
    tomatoes.push({
      x: Math.random() * innerWidth, y: -s - (spread ? Math.random() * innerHeight * 0.6 : 0),
      vy: (1.6 + Math.random() * 2) * Kt, sway: Math.random() * 6.28, sw: 0.02 + Math.random() * 0.03,
      amp: 0.6 + Math.random() * 1.2, s: s, r: (Math.random() - 0.5) * 0.8, vr: (Math.random() - 0.5) * 0.03
    });
  }
  function setRain(on) {
    if (on && !raining) {
      raining = true;
      for (var i = 0; i < (reduce ? 6 : 16); i++) spawnTomato(true);
      spawnTimer = setInterval(function () {
        var n = reduce ? 1 : 1 + (Math.random() < 0.5 ? 1 : 0);
        for (var j = 0; j < n; j++) spawnTomato(false);
        kick();
      }, reduce ? 900 : 420);
      kick();
    } else if (!on && raining) {
      raining = false;
      clearInterval(spawnTimer);
    }
  }
  function drawTomatoes() {
    tomatoes = tomatoes.filter(function (p) { return p.y < innerHeight + 60; });
    tomatoes.forEach(function (p) {
      p.y += p.vy; p.sway += p.sw; p.x += Math.sin(p.sway) * p.amp; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      drawTomato(p.s);
      cx.restore();
    });
  }

  /* ---------- one tomato, thrown at the middle of the screen, and squashed ---------- */
  /* ---------- sounds: bright and sharp, so they are heard over music ---------- */
  var VOL = 0.7;
  function audio() {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noiseBuf(sec, curve) {
    var n = Math.floor(ac.sampleRate * sec), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, curve);
    return buf;
  }
  function noise(t, sec, curve, type, freq, q, gain) {
    var src = ac.createBufferSource(); src.buffer = noiseBuf(sec, curve);
    var f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; if (q) f.Q.value = q;
    var g = ac.createGain(); g.gain.value = gain * VOL;
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
    return f;
  }
  function tone(t, freq, type, len, peak) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * VOL), t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + len + 0.02);
  }
  // The tomato flying in: a slide whistle (a pure tone with a little vibrato, gliding up).
  function whoosh(sec) {
    if (!VOL) return;
    try {
      audio();
      var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      var lfo = ac.createOscillator(), depth = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(650, t); o.frequency.exponentialRampToValueAtTime(2300, t + sec);
      lfo.frequency.value = 11; depth.gain.value = 28; lfo.connect(depth); depth.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.32 * VOL, t + 0.04);
      g.gain.setValueAtTime(0.32 * VOL, t + sec - 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + sec);
      o.connect(g); g.connect(ac.destination);
      o.start(t); lfo.start(t); o.stop(t + sec + 0.02); lfo.stop(t + sec + 0.02);
      noise(t, sec, 0.1, 'bandpass', 2600, 3, 0.05); // a breath of air in the whistle
    } catch (e) {}
  }
  // The splat: a low thump, a wet crack and a splash.
  function squish() {
    if (!VOL) return;
    try {
      audio();
      var t = ac.currentTime;
      var o = ac.createOscillator(), og = ac.createGain();
      o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.18);
      og.gain.setValueAtTime(1.0 * VOL, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
      o.connect(og); og.connect(ac.destination); o.start(t); o.stop(t + 0.25);
      noise(t, 0.28, 2.4, 'bandpass', 1300, 0.9, 1.6);
      noise(t + 0.02, 0.12, 3, 'highpass', 3500, 0, 0.7);
      noise(t + 0.06, 0.4, 1.6, 'lowpass', 900, 0, 0.5);
    } catch (e) {}
  }
  // Confetti: applause and a cheering crowd, made from scratch (no sound files). Only noise,
  // no buzzing tones: dense hand claps, a breathy "haaa" roar, and a couple of finger whistles.
  function cheer(big) {
    if (!VOL) return;
    try {
      audio();
      var sr = ac.sampleRate, dur = big ? 3 : 1.8, n = Math.floor(sr * dur), t = ac.currentTime, i, v;
      function env(x) { return Math.min(1, x / 0.15) * Math.min(1, (dur - x) / 0.9); } // swell in, fade out
      // Applause: many short claps, each a little different.
      var cb = ac.createBuffer(1, n, sr), c = cb.getChannelData(0);
      var claps = Math.floor((big ? 120 : 95) * dur);
      for (v = 0; v < claps; v++) {
        var at = Math.random() * dur, c0 = Math.floor(at * sr), len = Math.floor((0.008 + Math.random() * 0.012) * sr);
        var amp = (0.25 + Math.random() * 0.45) * env(at), tone = Math.random(), prev = 0;
        for (i = 0; i < len && c0 + i < n; i++) {
          var w = Math.random() * 2 - 1, s = tone * w + (1 - tone) * (w - prev); prev = w; // between dull and bright
          c[c0 + i] += s * amp * Math.exp(-i / (0.003 * sr));
        }
      }
      var cs = ac.createBufferSource(); cs.buffer = cb;
      var chp = ac.createBiquadFilter(); chp.type = 'highpass'; chp.frequency.value = 700;
      var cg = ac.createGain(); cg.gain.value = 0.9 * VOL;
      cs.connect(chp); chp.connect(cg); cg.connect(ac.destination); cs.start(t);
      // The crowd's roar: breathy noise shaped like an open "ah", rising and falling a little.
      var rb = ac.createBuffer(1, n, sr), r = rb.getChannelData(0), wob = Math.random() * 6;
      for (i = 0; i < n; i++) { var x = i / sr; r[i] = (Math.random() * 2 - 1) * env(x) * (0.8 + 0.2 * Math.sin(6.283 * 1.3 * x + wob)); }
      var rs = ac.createBufferSource(); rs.buffer = rb;
      var f1 = ac.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 750; f1.Q.value = 1.4;
      var f2 = ac.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1250; f2.Q.value = 1.6;
      var rg = ac.createGain(); rg.gain.value = 0.55 * VOL;
      rs.connect(f1); rs.connect(f2); f1.connect(rg); f2.connect(rg); rg.connect(ac.destination); rs.start(t);
      // Finger whistles from the crowd: "fweee-oo".
      var whistles = big ? 3 : 1;
      for (v = 0; v < whistles; v++) {
        var w0 = t + 0.15 + Math.random() * (dur - 1), wl = 0.45 + Math.random() * 0.25, base = 1900 + Math.random() * 500;
        var o = ac.createOscillator(), og = ac.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(base * 0.8, w0);
        o.frequency.exponentialRampToValueAtTime(base * 1.25, w0 + wl * 0.35); o.frequency.exponentialRampToValueAtTime(base * 0.9, w0 + wl);
        og.gain.setValueAtTime(0.0001, w0); og.gain.exponentialRampToValueAtTime(0.16 * VOL, w0 + 0.04);
        og.gain.setValueAtTime(0.16 * VOL, w0 + wl - 0.08); og.gain.exponentialRampToValueAtTime(0.0001, w0 + wl);
        o.connect(og); og.connect(ac.destination); o.start(w0); o.stop(w0 + wl + 0.02);
      }
    } catch (e) {}
  }
  function onSound(m) {
    if (!m) return;
    VOL = Math.max(0, Math.min(1, (m.vol == null ? 70 : +m.vol) / 100));
    if (m.kind === 'pop' || m.kind === 'popBig') cheer(m.kind === 'popBig');
  }
  function throwTomato(m) {
    if (m && m.vol != null) VOL = Math.max(0, Math.min(1, +m.vol / 100));
    var W = innerWidth, H = innerHeight;
    // The flight starts on the first frame actually drawn, so a window that has only just
    // appeared still shows the whole throw instead of jumping straight to the splat.
    flights.push({
      t0: null, dur: 700,
      x0: W / 2 + (Math.random() - 0.5) * W * 0.3, y0: H * 1.08,
      cx: W / 2 + (Math.random() - 0.5) * W * 0.25, cy: H * 0.32,
      x1: W / 2, y1: H / 2, size: Math.min(W, H) * 0.17, spin: (Math.random() < 0.5 ? -1 : 1) * (2.5 + Math.random() * 2)
    });
    kick();
  }
  function makeSplat(x, y, size) {
    var R = size * 1.25, N = 28, pts = [], drops = [], seeds = [], drips = [], i, a;
    for (i = 0; i < N; i++) pts.push({ a: i / N * 6.2832, r: R * (i % 3 === 0 ? 1.35 + Math.random() * 0.35 : 0.78 + Math.random() * 0.3) });
    for (i = 0; i < 26; i++) drops.push({ a: Math.random() * 6.2832, d: R * (1.15 + Math.random() * 1.4), r: (3 + Math.random() * 10) * Kt });
    for (i = 0; i < 9; i++) { a = Math.random() * 6.2832; var dd = R * 0.6 * Math.sqrt(Math.random()); seeds.push({ x: Math.cos(a) * dd, y: Math.sin(a) * dd * 0.8, rot: Math.random() * 3.14 }); }
    for (i = 0; i < 5; i++) drips.push({ dx: (Math.random() - 0.5) * R * 1.3, w: (7 + Math.random() * 7) * Kt, len: R * (0.7 + Math.random() * 0.9), delay: 250 + Math.random() * 550 });
    splats.push({ t0: performance.now(), x: x, y: y, R: R, pts: pts, drops: drops, seeds: seeds, drips: drips });
    squish();
  }
  function drawFlights(now) {
    flights = flights.filter(function (f) {
      if (f.t0 == null) { f.t0 = now; whoosh(f.dur / 1000); }
      var p = (now - f.t0) / f.dur;
      if (p >= 1) { makeSplat(f.x1, f.y1, f.size); return false; }
      var e = Math.pow(p, 1.15), u = 1 - e;
      var x = u * u * f.x0 + 2 * u * e * f.cx + e * e * f.x1;
      var y = u * u * f.y0 + 2 * u * e * f.cy + e * e * f.y1;
      var sc = 0.18 + 0.82 * Math.pow(p, 1.4);
      cx.save(); cx.translate(x, y); cx.rotate(f.spin * p); drawTomato(f.size * sc); cx.restore();
      return true;
    });
  }
  function drawSplats(now) {
    splats = splats.filter(function (s) {
      var t = now - s.t0;
      if (t > 4800) return false;
      var g = Math.min(1, t / 140), o = g - 1;
      var sc = 0.35 + 0.65 * (1 + 2.70158 * o * o * o + 1.70158 * o * o);
      var alpha = t < 3600 ? 1 : Math.max(0, 1 - (t - 3600) / 1200);
      cx.save(); cx.globalAlpha = alpha; cx.translate(s.x, s.y);
      cx.fillStyle = '#D8351F';
      s.drops.forEach(function (d) {
        if (d.d / s.R > g * 2.6) return;
        cx.save(); cx.translate(Math.cos(d.a) * d.d * sc, Math.sin(d.a) * d.d * sc); cx.rotate(d.a);
        cx.beginPath(); cx.ellipse(0, 0, d.r * 2.2, d.r * 0.9, 0, 0, 6.28); cx.fill(); cx.restore();
      });
      s.drips.forEach(function (d) {
        var el = t - d.delay; if (el <= 0) return;
        var pr = Math.min(1, el / 1300), len = d.len * (1 - Math.pow(1 - pr, 3)), y0 = s.R * 0.5 * sc;
        cx.strokeStyle = '#D2351F'; cx.lineWidth = d.w; cx.lineCap = 'round';
        cx.beginPath(); cx.moveTo(d.dx * sc, y0); cx.lineTo(d.dx * sc, y0 + len); cx.stroke();
        cx.beginPath(); cx.arc(d.dx * sc, y0 + len, d.w * 0.75, 0, 6.28); cx.fill();
      });
      var P = s.pts.map(function (q) { return { x: Math.cos(q.a) * q.r * 1.12 * sc, y: Math.sin(q.a) * q.r * 0.92 * sc }; });
      var grad = cx.createRadialGradient(0, 0, s.R * 0.1, 0, 0, s.R * 1.3 * sc);
      grad.addColorStop(0, '#C9301C'); grad.addColorStop(1, '#E5402B');
      cx.fillStyle = grad; cx.strokeStyle = 'rgba(110,20,10,0.35)'; cx.lineWidth = 3;
      cx.beginPath();
      cx.moveTo((P[P.length - 1].x + P[0].x) / 2, (P[P.length - 1].y + P[0].y) / 2);
      for (var i = 0; i < P.length; i++) {
        var nx = P[(i + 1) % P.length];
        cx.quadraticCurveTo(P[i].x, P[i].y, (P[i].x + nx.x) / 2, (P[i].y + nx.y) / 2);
      }
      cx.closePath(); cx.fill(); cx.stroke();
      s.seeds.forEach(function (sd) {
        cx.save(); cx.translate(sd.x * sc, sd.y * sc); cx.rotate(sd.rot);
        cx.fillStyle = '#F3E3A1'; cx.strokeStyle = 'rgba(120,70,20,0.5)'; cx.lineWidth = 1;
        cx.beginPath(); cx.ellipse(0, 0, 9 * Kt, 5 * Kt, 0, 0, 6.28); cx.fill(); cx.stroke(); cx.restore();
      });
      cx.fillStyle = 'rgba(255,255,255,0.28)';
      cx.beginPath(); cx.ellipse(-s.R * 0.32 * sc, -s.R * 0.28 * sc, s.R * 0.22 * sc, s.R * 0.1 * sc, -0.5, 0, 6.28); cx.fill();
      cx.save(); cx.translate(-s.R * 0.45 * sc, -s.R * 0.4 * sc); cx.rotate(-0.4); cx.fillStyle = '#3E8E41';
      for (var k = 0; k < 5; k++) { cx.beginPath(); cx.ellipse(0, -s.R * 0.12, s.R * 0.05, s.R * 0.16, 0, 0, 6.28); cx.fill(); cx.rotate(1.2566); }
      cx.restore();
      cx.restore();
      return true;
    });
  }

  function frame() {
    var now = performance.now();
    cx.clearRect(0, 0, innerWidth, innerHeight);
    drawTomatoes(); drawConfetti(); drawSplats(now); drawFlights(now);
    var live = raining || tomatoes.length || confetti.length || flights.length || splats.length;
    raf = live ? requestAnimationFrame(frame) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }

  var msgTimer = 0, ICONS = { wilt: '🍅', splat: '💥', brk: '☕' };
  function showMessage(m) {
    if (!m || !m.text) return;
    var el = document.getElementById('msg');
    el.dir = /[֐-׿]/.test(m.text) ? 'rtl' : 'ltr';
    el.querySelector('.ico').textContent = ICONS[m.icon] || '';
    el.querySelector('.t').textContent = m.text;
    el.querySelector('.sub').textContent = m.sub || '';
    // A squash message sits lower, so the splat in the middle stays visible.
    var base = (m.icon === 'wilt' ? 'wilt ' : '') + (m.icon === 'brk' ? 'calm ' : '') + (m.icon === 'splat' ? 'low ' : '');
    el.className = base;
    void el.offsetWidth; // restart the entrance animation
    el.className = base + 'show';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { el.className = base; }, Math.min(15000, m.ms || 6000));
  }

  if (window.confettiApp) {
    if (window.confettiApp.onMessage) window.confettiApp.onMessage(showMessage);
    if (window.confettiApp.onSound) window.confettiApp.onSound(onSound);
    window.confettiApp.onBurst(burst);
    window.confettiApp.onRain(setRain);
    window.confettiApp.onSplat(throwTomato);
  }
})();
</script>
</body>
</html>
