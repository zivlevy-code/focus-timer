<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Screen effects</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var cv = document.getElementById('c'), cx = cv.getContext('2d'), raf = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var confetti = [], tomatoes = [], flights = [], splats = [];
  var raining = false, spawnTimer = 0, ac = null;
  var COLORS = ['#F2B134', '#E4572E', '#3C7DD9', '#2FA97C', '#E36AA6', '#8E6CEF'];
  var Kc = 1, Kt = 1;
  function size() {
    var d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
    Kc = Math.min(2.2, Math.max(1, innerHeight / 800));
    Kt = Math.min(1.8, Math.max(1, innerHeight / 900));
  }
  addEventListener('resize', size); size();
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  /* ---------- confetti: from the bottom corners, and the middle for the big one ---------- */
  function burst(big) {
    var n = (big ? 240 : 140) * (reduce ? 0.3 : 1);
    var spots = big ? [0.1, 0.5, 0.9] : [0.1, 0.9];
    for (var i = 0; i < n; i++) {
      var f = spots[i % spots.length];
      var dir = f < 0.4 ? 1 : f > 0.6 ? -1 : (Math.random() < 0.5 ? 1 : -1);
      confetti.push({
        x: innerWidth * f, y: innerHeight * 0.95,
        vx: dir * (2 + Math.random() * 8) * Kc + (Math.random() - 0.5) * 3,
        vy: -(11 + Math.random() * 13) * Kc, g: 0.38 * Kc,
        s: 7 + Math.random() * 8, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
        c: COLORS[(Math.random() * COLORS.length) | 0], life: 0, round: Math.random() < 0.3
      });
    }
    kick();
  }
  function drawConfetti() {
    confetti = confetti.filter(function (p) { return p.y < innerHeight + 30 && p.life < 300; });
    confetti.forEach(function (p) {
      p.life++; p.vy += p.g; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      cx.globalAlpha = Math.max(0, 1 - p.life / 300);
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 6.28); cx.fill(); }
      else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cx.restore();
    });
  }

  /* ---------- a tomato ---------- */
  function drawTomato(s) {
    cx.fillStyle = '#E5402B';
    cx.beginPath(); cx.ellipse(0, s * 0.12, s * 0.5, s * 0.43, 0, 0, 6.28); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,0.35)';
    cx.beginPath(); cx.ellipse(-s * 0.2, -s * 0.02, s * 0.11, s * 0.06, -0.6, 0, 6.28); cx.fill();
    cx.fillStyle = '#3E8E41';
    cx.save(); cx.translate(0, -s * 0.24);
    for (var k = 0; k < 5; k++) {
      cx.beginPath(); cx.ellipse(0, -s * 0.09, s * 0.05, s * 0.14, 0, 0, 6.28); cx.fill();
      cx.rotate(1.2566);
    }
    cx.restore();
    cx.fillStyle = '#2D6B30';
    cx.fillRect(-s * 0.03, -s * 0.46, s * 0.06, s * 0.2);
  }

  /* ---------- tomato rain, for as long as the break lasts ---------- */
  function spawnTomato(spread) {
    var s = (24 + Math.random() * 28) * Kt;
    tomatoes.push({
      x: Math.random() * innerWidth, y: -s - (spread ? Math.random() * innerHeight * 0.6 : 0),
      vy: (1.6 + Math.random() * 2) * Kt, sway: Math.random() * 6.28, sw: 0.02 + Math.random() * 0.03,
      amp: 0.6 + Math.random() * 1.2, s: s, r: (Math.random() - 0.5) * 0.8, vr: (Math.random() - 0.5) * 0.03
    });
  }
  function setRain(on) {
    if (on && !raining) {
      raining = true;
      for (var i = 0; i < (reduce ? 6 : 16); i++) spawnTomato(true);
      spawnTimer = setInterval(function () {
        var n = reduce ? 1 : 1 + (Math.random() < 0.5 ? 1 : 0);
        for (var j = 0; j < n; j++) spawnTomato(false);
        kick();
      }, reduce ? 900 : 420);
      kick();
    } else if (!on && raining) {
      raining = false;
      clearInterval(spawnTimer);
    }
  }
  function drawTomatoes() {
    tomatoes = tomatoes.filter(function (p) { return p.y < innerHeight + 60; });
    tomatoes.forEach(function (p) {
      p.y += p.vy; p.sway += p.sw; p.x += Math.sin(p.sway) * p.amp; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      drawTomato(p.s);
      cx.restore();
    });
  }

  /* ---------- one tomato, thrown at the middle of the screen, and squashed ---------- */
  function squish() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var n = Math.floor(ac.sampleRate * 0.2), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
      var src = ac.createBufferSource(); src.buffer = buf;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
      var g = ac.createGain(); g.gain.value = 0.55;
      src.connect(lp); lp.connect(g); g.connect(ac.destination); src.start();
      var o = ac.createOscillator(), og = ac.createGain();
      o.frequency.setValueAtTime(140, ac.currentTime); o.frequency.exponentialRampToValueAtTime(45, ac.currentTime + 0.14);
      og.gain.setValueAtTime(0.5, ac.currentTime); og.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.16);
      o.connect(og); og.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.18);
    } catch (e) {}
  }
  function throwTomato() {
    var W = innerWidth, H = innerHeight;
    flights.push({
      t0: performance.now(), dur: 520,
      x0: W / 2 + (Math.random() - 0.5) * W * 0.3, y0: H * 1.08,
      cx: W / 2 + (Math.random() - 0.5) * W * 0.25, cy: H * 0.32,
      x1: W / 2, y1: H / 2, size: Math.min(W, H) * 0.17, spin: (Math.random() < 0.5 ? -1 : 1) * (2.5 + Math.random() * 2)
    });
    kick();
  }
  function makeSplat(x, y, size) {
    var R = size * 1.25, N = 28, pts = [], drops = [], seeds = [], drips = [], i, a;
    for (i = 0; i < N; i++) pts.push({ a: i / N * 6.2832, r: R * (i % 3 === 0 ? 1.35 + Math.random() * 0.35 : 0.78 + Math.random() * 0.3) });
    for (i = 0; i < 26; i++) drops.push({ a: Math.random() * 6.2832, d: R * (1.15 + Math.random() * 1.4), r: (3 + Math.random() * 10) * Kt });
    for (i = 0; i < 9; i++) { a = Math.random() * 6.2832; var dd = R * 0.6 * Math.sqrt(Math.random()); seeds.push({ x: Math.cos(a) * dd, y: Math.sin(a) * dd * 0.8, rot: Math.random() * 3.14 }); }
    for (i = 0; i < 5; i++) drips.push({ dx: (Math.random() - 0.5) * R * 1.3, w: (7 + Math.random() * 7) * Kt, len: R * (0.7 + Math.random() * 0.9), delay: 250 + Math.random() * 550 });
    splats.push({ t0: performance.now(), x: x, y: y, R: R, pts: pts, drops: drops, seeds: seeds, drips: drips });
    squish();
  }
  function drawFlights(now) {
    flights = flights.filter(function (f) {
      var p = (now - f.t0) / f.dur;
      if (p >= 1) { makeSplat(f.x1, f.y1, f.size); return false; }
      var e = Math.pow(p, 1.15), u = 1 - e;
      var x = u * u * f.x0 + 2 * u * e * f.cx + e * e * f.x1;
      var y = u * u * f.y0 + 2 * u * e * f.cy + e * e * f.y1;
      var sc = 0.18 + 0.82 * Math.pow(p, 1.4);
      cx.save(); cx.translate(x, y); cx.rotate(f.spin * p); drawTomato(f.size * sc); cx.restore();
      return true;
    });
  }
  function drawSplats(now) {
    splats = splats.filter(function (s) {
      var t = now - s.t0;
      if (t > 4800) return false;
      var g = Math.min(1, t / 140), o = g - 1;
      var sc = 0.35 + 0.65 * (1 + 2.70158 * o * o * o + 1.70158 * o * o);
      var alpha = t < 3600 ? 1 : Math.max(0, 1 - (t - 3600) / 1200);
      cx.save(); cx.globalAlpha = alpha; cx.translate(s.x, s.y);
      cx.fillStyle = '#D8351F';
      s.drops.forEach(function (d) {
        if (d.d / s.R > g * 2.6) return;
        cx.save(); cx.translate(Math.cos(d.a) * d.d * sc, Math.sin(d.a) * d.d * sc); cx.rotate(d.a);
        cx.beginPath(); cx.ellipse(0, 0, d.r * 2.2, d.r * 0.9, 0, 0, 6.28); cx.fill(); cx.restore();
      });
      s.drips.forEach(function (d) {
        var el = t - d.delay; if (el <= 0) return;
        var pr = Math.min(1, el / 1300), len = d.len * (1 - Math.pow(1 - pr, 3)), y0 = s.R * 0.5 * sc;
        cx.strokeStyle = '#D2351F'; cx.lineWidth = d.w; cx.lineCap = 'round';
        cx.beginPath(); cx.moveTo(d.dx * sc, y0); cx.lineTo(d.dx * sc, y0 + len); cx.stroke();
        cx.beginPath(); cx.arc(d.dx * sc, y0 + len, d.w * 0.75, 0, 6.28); cx.fill();
      });
      var P = s.pts.map(function (q) { return { x: Math.cos(q.a) * q.r * 1.12 * sc, y: Math.sin(q.a) * q.r * 0.92 * sc }; });
      var grad = cx.createRadialGradient(0, 0, s.R * 0.1, 0, 0, s.R * 1.3 * sc);
      grad.addColorStop(0, '#C9301C'); grad.addColorStop(1, '#E5402B');
      cx.fillStyle = grad; cx.strokeStyle = 'rgba(110,20,10,0.35)'; cx.lineWidth = 3;
      cx.beginPath();
      cx.moveTo((P[P.length - 1].x + P[0].x) / 2, (P[P.length - 1].y + P[0].y) / 2);
      for (var i = 0; i < P.length; i++) {
        var nx = P[(i + 1) % P.length];
        cx.quadraticCurveTo(P[i].x, P[i].y, (P[i].x + nx.x) / 2, (P[i].y + nx.y) / 2);
      }
      cx.closePath(); cx.fill(); cx.stroke();
      s.seeds.forEach(function (sd) {
        cx.save(); cx.translate(sd.x * sc, sd.y * sc); cx.rotate(sd.rot);
        cx.fillStyle = '#F3E3A1'; cx.strokeStyle = 'rgba(120,70,20,0.5)'; cx.lineWidth = 1;
        cx.beginPath(); cx.ellipse(0, 0, 9 * Kt, 5 * Kt, 0, 0, 6.28); cx.fill(); cx.stroke(); cx.restore();
      });
      cx.fillStyle = 'rgba(255,255,255,0.28)';
      cx.beginPath(); cx.ellipse(-s.R * 0.32 * sc, -s.R * 0.28 * sc, s.R * 0.22 * sc, s.R * 0.1 * sc, -0.5, 0, 6.28); cx.fill();
      cx.save(); cx.translate(-s.R * 0.45 * sc, -s.R * 0.4 * sc); cx.rotate(-0.4); cx.fillStyle = '#3E8E41';
      for (var k = 0; k < 5; k++) { cx.beginPath(); cx.ellipse(0, -s.R * 0.12, s.R * 0.05, s.R * 0.16, 0, 0, 6.28); cx.fill(); cx.rotate(1.2566); }
      cx.restore();
      cx.restore();
      return true;
    });
  }

  function frame() {
    var now = performance.now();
    cx.clearRect(0, 0, innerWidth, innerHeight);
    drawTomatoes(); drawConfetti(); drawSplats(now); drawFlights(now);
    var live = raining || tomatoes.length || confetti.length || flights.length || splats.length;
    raf = live ? requestAnimationFrame(frame) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }

  if (window.confettiApp) {
    window.confettiApp.onBurst(burst);
    window.confettiApp.onRain(setRain);
    window.confettiApp.onSplat(throwTomato);
  }
})();
</script>
</body>
</html>
