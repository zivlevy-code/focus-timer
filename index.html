<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>זמן עבודה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #EDF1F5;
  --surface: #FFFFFF;
  --ink: #172433;
  --muted: #5B6B7B;
  --line: #D5DDE5;
  --work: #1B4B8F;
  --break: #1F7A5A;
  --accent: var(--work);
  --on-accent: #FFFFFF;
  --soft: #E3EAF2;
  --danger: #B3321F;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1621; --surface: #172332; --ink: #E8EEF4; --muted: #9AABBB; --line: #2A3A4D;
    --work: #7DB0FF; --break: #62D0A3; --on-accent: #0E1621; --soft: #1F3044; --danger: #FF8E7A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1621; --surface: #172332; --ink: #E8EEF4; --muted: #9AABBB; --line: #2A3A4D;
  --work: #7DB0FF; --break: #62D0A3; --on-accent: #0E1621; --soft: #1F3044; --danger: #FF8E7A;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Assistant", "Segoe UI", Arial, sans-serif; font-size: 17px; line-height: 1.5;
}
body.is-break { --accent: var(--break); }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 56px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.timer {
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 28px 20px 22px; text-align: center;
}
.mode { margin: 0; font-weight: 600; color: var(--accent); font-size: 18px; }
.hero { display: block; margin: 0 auto 6px; transform-origin: 50% 90%; animation: bob 2.4s ease-in-out infinite; }
.hero[hidden] { display: none; }
@keyframes bob { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .hero { animation: none; } }
.digits {
  font-family: "Secular One", "Assistant", Arial, sans-serif;
  font-size: clamp(76px, 22vw, 116px); line-height: 1.05; letter-spacing: 0.02em;
  margin: 4px 0 0; color: var(--ink); direction: ltr; font-variant-numeric: tabular-nums;
}
.current { margin: 6px 0 16px; color: var(--muted); min-height: 1.5em; }
.current strong { color: var(--ink); font-weight: 600; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 0 auto 20px; max-width: 360px; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s linear; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 11px 18px; font-weight: 600; min-height: 46px;
}
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); font-weight: 400; min-height: 40px; padding: 8px 12px; }
.btn.ghost:hover { color: var(--ink); background: var(--soft); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost[aria-pressed="true"] { color: var(--accent); background: var(--soft); font-weight: 600; }
.note { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
.note:empty { display: none; }

.choice {
  margin-top: 16px; padding: 16px; border-radius: 14px; background: var(--soft);
  border: 1px solid var(--line); text-align: center;
}
.choice[hidden] { display: none; }
.choice p { margin: 0 0 12px; font-weight: 600; }
.choice input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 46px; width: 150px; }

section.tasks { margin-top: 28px; }
h2 { font-family: "Secular One", "Assistant", Arial, sans-serif; font-weight: 400; font-size: 24px; margin: 0 0 12px; }
.add { display: flex; gap: 8px; margin-bottom: 14px; }
.add input {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; min-height: 46px;
}
.add input::placeholder { color: var(--muted); }
.add input.nudge { border-color: var(--danger); }
ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task {
  display: flex; align-items: center; gap: 8px; background: var(--surface);
  border: 1px solid var(--line); border-inline-start: 5px solid transparent;
  border-radius: 12px; padding: 6px 8px;
}
.task.current { border-inline-start-color: var(--accent); }
.task .check {
  flex: none; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line);
  background: transparent; display: grid; place-items: center; color: transparent;
}
.task .check:hover { border-color: var(--accent); }
.task.done .check { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.task .name {
  flex: 1; min-width: 0; text-align: start; background: none; border: 0; padding: 8px 4px; overflow-wrap: anywhere;
}
.task.done .name { text-decoration: line-through; color: var(--muted); }
.task .t { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; direction: ltr; font-size: 15px; }
.task.current .t { color: var(--accent); font-weight: 700; }
.task .del { flex: none; border: 0; background: none; color: var(--muted); width: 34px; height: 34px; border-radius: 8px; font-size: 22px; line-height: 1; }
.task .del:hover { color: var(--danger); background: var(--soft); }
.task .main { flex: 1; min-width: 0; }
.task .main .name { display: block; width: 100%; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 4px 6px; }
.chip { position: relative; font: inherit; font-size: 13px; line-height: 1.6; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; padding: 1px 10px; cursor: pointer; }
.chip:hover { background: var(--soft); }
.chip.pri-2 { color: var(--danger); border-color: var(--danger); font-weight: 600; }
.chip.pri-0 { opacity: .85; }
.chip.late { color: var(--danger); border-color: var(--danger); background: var(--soft); font-weight: 700; }
.chip.soon { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.chip.empty { border-style: dashed; }
.chip.static { cursor: default; }
.chip.static:hover { background: var(--surface); }
.dateinp { font: inherit; font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; min-height: 0; line-height: 1.6; cursor: pointer; }
.chip input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
.head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.head h2 { margin: 0; }
.sort, .add-extra label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; }
.add-extra { display: flex; flex-wrap: wrap; gap: 14px; margin: -6px 0 14px; }
.add-extra select, .add-extra input, .sort select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 38px; }
.empty { color: var(--muted); padding: 18px 4px; }

.summary { margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; text-align: center; }
.stat b { display: block; font-family: "Secular One", "Assistant", Arial, sans-serif; font-weight: 400; font-size: 26px; direction: ltr; }
.stat span { color: var(--muted); font-size: 14px; }

details { margin-top: 20px; color: var(--muted); }
details summary { cursor: pointer; padding: 6px 0; }
.settings { display: flex; flex-wrap: wrap; gap: 14px; align-items: end; padding: 10px 0; }
.settings label { display: grid; gap: 4px; font-size: 15px; }
.settings input { width: 100px; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }

canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <div class="timer">
    <svg class="hero" id="hero" viewBox="0 0 64 64" width="72" height="72" aria-hidden="true" hidden>
      <ellipse cx="32" cy="37" rx="25" ry="22" fill="#E5402B"/>
      <ellipse cx="22" cy="31" rx="6" ry="3.5" transform="rotate(-35 22 31)" fill="#fff" opacity=".38"/>
      <path d="M32 16 L35.5 22.5 L43 20 L38.5 26 L45 29.5 L36.5 29 L32 34 L27.5 29 L19 29.5 L25.5 26 L21 20 L28.5 22.5 Z" fill="#3E8E41"/>
      <rect x="30.4" y="8" width="3.2" height="9" rx="1.6" fill="#2D6B30"/>
    </svg>
    <p class="mode" id="mode" aria-live="polite">מוכנים להתחיל</p>
    <p class="digits" id="digits">25:00</p>
    <p class="current" id="current"></p>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="row">
      <button class="btn primary" id="startBtn">התחל זמן עבודה</button>
      <button class="btn" id="finishBtn">סיימתי את המשימה</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn ghost" id="skipBtn" hidden>דלג על ההפסקה</button>
      <button class="btn ghost" id="lunchBtn">הפסקת צהריים</button>
      <button class="btn ghost" id="wakeBtn" aria-pressed="false">השאר מסך דלוק</button>
      <button class="btn ghost" id="resetBtn">אפס טיימר</button>
    </div>
    <p class="note" id="wakeNote" aria-live="polite"></p>
    <div class="choice" id="lunchPanel" hidden>
      <p>כמה זמן הפסקת הצהריים?</p>
      <div class="row">
        <button class="btn" data-lunch="30">30 דק׳</button>
        <button class="btn" data-lunch="45">45 דק׳</button>
        <button class="btn" data-lunch="60">60 דק׳</button>
      </div>
      <div class="row" style="margin-top:10px">
        <input type="number" id="lunchCustom" min="1" max="240" placeholder="אחר (בדקות)" aria-label="זמן הפסקת צהריים בדקות">
        <button class="btn primary" id="lunchGo">צא להפסקה</button>
      </div>
    </div>
    <div class="choice" id="choice" hidden>
      <p id="choiceText"></p>
      <div class="row">
        <button class="btn primary" id="earlyBreak">להקדים את ההפסקה</button>
        <button class="btn" id="nextTask">להתחיל את המשימה הבאה</button>
      </div>
    </div>
  </div>

  <section class="tasks">
    <div class="head">
      <h2>המשימות להיום</h2>
      <label class="sort">מיון
        <select id="sortBy">
          <option value="manual">לפי סדר ההוספה</option>
          <option value="priority">לפי דחיפות</option>
          <option value="due">לפי תאריך הגשה</option>
        </select>
      </label>
    </div>
    <div class="add">
      <input id="newTask" type="text" placeholder="מה צריך לעשות?" maxlength="120" aria-label="משימה חדשה">
      <button class="btn primary" id="addBtn">הוסף</button>
    </div>
    <div class="add-extra">
      <label>דחיפות
        <select id="newPri">
          <option value="0">נמוכה</option>
          <option value="1" selected>רגילה</option>
          <option value="2">גבוהה</option>
        </select>
      </label>
      <label>תאריך הגשה <input type="date" id="newDue"></label>
    </div>
    <ul class="list" id="list"></ul>
  </section>

  <section class="summary" aria-label="סיכום">
    <div class="stat"><b id="sTime">00:00</b><span>זמן עבודה כולל</span></div>
    <div class="stat"><b id="sDone">0/0</b><span>משימות שהושלמו</span></div>
    <div class="stat"><b id="sPomo">0</b><span>סבבים מלאים</span></div>
  </section>

  <details>
    <summary>הגדרות</summary>
    <div class="settings">
      <label>דקות עבודה <input type="number" id="workMin" min="1" max="120" value="25"></label>
      <label>דקות הפסקה <input type="number" id="breakMin" min="1" max="60" value="5"></label>
      <button class="btn ghost" id="clearDone">נקה משימות שהושלמו</button>
      <button class="btn ghost" id="clearAll">התחל יום חדש</button>
    </div>
  </details>
</main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  var KEY = 'focus-timer-v1';
  var $ = function (s) { return document.querySelector(s); };
  var S = { tasks: [], currentId: null, mode: 'idle', running: false, remaining: 25 * 60000, lastTick: 0, pomos: 0, work: 25, brk: 5, choosing: false };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (Array.isArray(o.tasks)) S.tasks = o.tasks.filter(function (t) { return t && typeof t.text === 'string'; });
      S.pomos = +o.pomos || 0;
      S.work = Math.min(120, Math.max(1, +o.work || 25));
      S.brk = Math.min(60, Math.max(1, +o.brk || 5));
      S.lunchMin = Math.min(240, Math.max(1, +o.lunchMin || 45));
      S.wake = !!o.wake;
      S.sort = ['manual', 'priority', 'due'].indexOf(o.sort) > -1 ? o.sort : 'manual';
      S.currentId = o.currentId || null;
    } catch (e) {}
    S.remaining = S.work * 60000;
  }
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ tasks: S.tasks, pomos: S.pomos, work: S.work, brk: S.brk, lunchMin: S.lunchMin, wake: wakeOn, sort: S.sort || 'manual', currentId: S.currentId }));
    } catch (e) {}
  }

  function fmt(ms, up) {
    var s = Math.max(0, up ? Math.ceil(ms / 1000) : Math.floor(ms / 1000));
    var m = Math.floor(s / 60);
    return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function byId(id) { return S.tasks.filter(function (t) { return t.id === id; })[0]; }
  var PRI = ['נמוכה', 'רגילה', 'גבוהה'];
  function priOf(t) { return t.pri === 0 || t.pri === 1 || t.pri === 2 ? t.pri : 1; }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function dueCmp(a, b) {
    if (a.due === b.due) return 0;
    if (!a.due) return 1;
    if (!b.due) return -1;
    return a.due < b.due ? -1 : 1;
  }
  function sorted() {
    var mode = S.sort || 'manual';
    var arr = S.tasks.map(function (t, i) { return { t: t, i: i }; });
    if (mode === 'manual') return S.tasks.slice();
    arr.sort(function (a, b) {
      if (a.t.done !== b.t.done) return a.t.done ? 1 : -1;
      var d = priOf(b.t) - priOf(a.t), e = dueCmp(a.t, b.t);
      if (mode === 'priority') { if (d) return d; if (e) return e; }
      else { if (e) return e; if (d) return d; }
      return a.i - b.i;
    });
    return arr.map(function (x) { return x.t; });
  }
  function dueInfo(due) {
    if (!due) return null;
    var p = due.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]), n = new Date();
    var t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var diff = Math.round((d - t0) / 86400000), short = pad2(+p[2]) + '.' + pad2(+p[1]);
    if (diff < 0) return { text: 'באיחור · ' + short, cls: 'late' };
    if (diff === 0) return { text: 'הגשה היום', cls: 'soon' };
    if (diff === 1) return { text: 'הגשה מחר', cls: 'soon' };
    return { text: 'הגשה ' + short, cls: '' };
  }
  function buildMeta(t) {
    var meta = document.createElement('div'); meta.className = 'meta';
    var p = priOf(t);
    var pb = document.createElement('button'); pb.className = 'chip pri-' + p;
    pb.textContent = 'דחיפות: ' + PRI[p];
    pb.setAttribute('aria-label', 'דחיפות ' + PRI[p] + ', לחצו לשינוי');
    pb.onclick = function () { t.pri = (priOf(t) + 1) % 3; save(); paintAll(); };
    var info = dueInfo(t.due);
    var st = null; if (info && info.cls) { st = document.createElement('span'); st.className = 'chip static ' + info.cls; st.textContent = info.text; }
    
    var di = document.createElement('input'); di.type = 'date'; di.value = t.due || '';
    di.setAttribute('aria-label', 'תאריך הגשה');
    di.className = 'dateinp'; di.title = 'תאריך הגשה';
    di.onchange = function () { t.due = di.value || ''; save(); paintAll(); };
    
    meta.appendChild(pb); if (st) meta.appendChild(st); meta.appendChild(di);
    return meta;
  }
  function firstOpen() { return sorted().filter(function (t) { return !t.done; })[0]; }
  function ensureCurrent() {
    var c = byId(S.currentId);
    if (!c || c.done) { var n = firstOpen(); S.currentId = n ? n.id : null; }
  }

  /* ---------- sound ---------- */
  var ctx = null;
  function beep(times) {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      var t0 = ctx.currentTime;
      for (var i = 0; i < (times || 2); i++) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = i % 2 ? 660 : 880;
        g.gain.setValueAtTime(0.0001, t0 + i * 0.22);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + i * 0.22 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.22 + 0.2);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0 + i * 0.22); o.stop(t0 + i * 0.22 + 0.21);
      }
    } catch (e) {}
  }

  /* ---------- confetti ---------- */
  var cv = $('#confetti'), cx = cv.getContext('2d'), parts = [], raf = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var COLORS = ['#F2B134', '#E4572E', '#3C7DD9', '#2FA97C', '#E36AA6', '#8E6CEF'];
  function sizeCanvas() {
    var d = window.devicePixelRatio || 1;
    cv.width = innerWidth * d; cv.height = innerHeight * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener('resize', sizeCanvas); sizeCanvas();
  function confetti(big) {
    var n = (big ? 160 : 90) * (reduce ? 0.3 : 1);
    var w = innerWidth;
    for (var i = 0; i < n; i++) {
      var left = i % 2 === 0;
      parts.push({
        x: left ? w * 0.15 : w * 0.85, y: innerHeight * 0.75,
        vx: (left ? 1 : -1) * (2 + Math.random() * 7) + (Math.random() - 0.5) * 3,
        vy: -(9 + Math.random() * 11),
        s: 6 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.35,
        c: COLORS[(Math.random() * COLORS.length) | 0], life: 0, round: Math.random() < 0.3
      });
    }
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function frame() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(function (p) { return p.y < innerHeight + 30 && p.life < 260; });
    parts.forEach(function (p) {
      p.life++; p.vy += 0.38; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
      cx.globalAlpha = Math.max(0, 1 - p.life / 260);
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 6.28); cx.fill(); }
      else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cx.restore();
    });
    drawToms();
    raf = (parts.length || toms.length) ? requestAnimationFrame(frame) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }

  /* ---------- background-safe end sound + notification ---------- */
  var sched = [];
  function cancelSched() {
    sched.forEach(function (o) { try { o.stop(); } catch (e) {} });
    sched = [];
  }
  function armEnd() {
    cancelSched();
    if (!S.running || !ctx || S.choosing) return;
    try {
      var at = ctx.currentTime + Math.max(0.05, S.remaining / 1000);
      var n = S.mode === 'work' ? 3 : 2;
      for (var i = 0; i < n; i++) {
        var o = ctx.createOscillator(), g = ctx.createGain(), t = at + i * 0.22;
        o.type = 'sine'; o.frequency.value = i % 2 ? 660 : 880;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.21);
        sched.push(o);
      }
    } catch (e) { sched = []; }
  }
  function notify(msg) {
    try {
      if (document.hidden && window.Notification && Notification.permission === 'granted') new Notification('זמן עבודה', { body: msg });
    } catch (e) {}
  }

  /* ---------- tomato rain ---------- */
  var toms = [];
  function tomatoRain() {
    var n = reduce ? 8 : 30, w = innerWidth;
    for (var i = 0; i < n; i++) {
      toms.push({ x: Math.random() * w, y: -40 - Math.random() * innerHeight * 0.9, vy: 1.6 + Math.random() * 2,
        sway: Math.random() * 6.28, sw: 0.02 + Math.random() * 0.03, amp: 0.6 + Math.random() * 1.2,
        s: 24 + Math.random() * 28, r: (Math.random() - 0.5) * 0.8, vr: (Math.random() - 0.5) * 0.03 });
    }
    if (!raf) raf = requestAnimationFrame(frame);
  }
  function drawTomato(s) {
    cx.fillStyle = '#E5402B';
    cx.beginPath(); cx.ellipse(0, s * 0.12, s * 0.5, s * 0.43, 0, 0, 6.28); cx.fill();
    cx.fillStyle = 'rgba(255,255,255,0.35)';
    cx.beginPath(); cx.ellipse(-s * 0.2, -s * 0.02, s * 0.11, s * 0.06, -0.6, 0, 6.28); cx.fill();
    cx.fillStyle = '#3E8E41';
    cx.save(); cx.translate(0, -s * 0.24);
    for (var k = 0; k < 5; k++) {
      cx.beginPath(); cx.ellipse(0, -s * 0.09, s * 0.05, s * 0.14, 0, 0, 6.28); cx.fill();
      cx.rotate(1.2566);
    }
    cx.restore();
    cx.fillStyle = '#2D6B30';
    cx.fillRect(-s * 0.03, -s * 0.46, s * 0.06, s * 0.2);
  }
  function drawToms() {
    var keep = S.mode === 'break' && S.running && !S.lunch;
    toms = toms.filter(function (p) {
      if (p.y >= innerHeight + 60) {
        if (!keep) return false;
        p.y = -60 - Math.random() * 200; p.x = Math.random() * innerWidth;
      }
      return true;
    });
    toms.forEach(function (p) {
      p.y += p.vy; p.sway += p.sw; p.x += Math.sin(p.sway) * p.amp; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      drawTomato(p.s);
      cx.restore();
    });
  }

  /* ---------- timer logic ---------- */
  function total() { return S.mode === 'break' ? (S.curBreak || S.brk * 60000) : S.work * 60000; }

  function tick() {
    if (!S.running) return;
    var now = Date.now(), dt = now - S.lastTick;
    S.lastTick = now;
    if (dt < 0) dt = 0;
    var used = Math.min(dt, S.remaining);
    S.remaining -= dt;
    if (S.mode === 'work') {
      var c = byId(S.currentId);
      if (c) { c.ms = (c.ms || 0) + used; }
    }
    if (S.remaining <= 0) { phaseEnded(); return; }
    paintTimer(); paintTaskTime(); paintSummary();
    if (Math.floor(now / 5000) !== Math.floor((now - dt) / 5000)) save();
  }

  function phaseEnded() {
    if (S.mode === 'work') {
      S.pomos++;
      confetti(true); if (!sched.length) beep(3); notify('הסבב הסתיים. זמן להפסקה 🍅');
      S.mode = 'break'; S.remaining = S.brk * 60000; S.lastTick = Date.now(); S.running = true; S.curBreak = S.brk * 60000; S.lunch = false; tomatoRain();
    } else {
      if (!sched.length) beep(2);
      notify('ההפסקה נגמרה. חוזרים לעבודה');
      S.mode = 'idle'; S.remaining = S.work * 60000; S.running = false;
    }
    save(); paintAll();
  }

  function start() {
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
    try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
    ensureCurrent();
    if (S.mode === 'idle') {
      if (!S.currentId) { nudge(); return; }
      S.mode = 'work'; S.remaining = S.work * 60000;
    }
    S.choosing = false;
    S.running = true; S.lastTick = Date.now();
    if (S.mode === 'break' && !toms.length) tomatoRain();
    paintAll();
  }
  function pause() { tick(); S.running = false; save(); paintAll(); }

  function finishTask() {
    ensureCurrent();
    var c = byId(S.currentId);
    if (!c) { nudge(); return; }
    if (S.mode === 'work' && S.running) tick();
    c.done = true;
    confetti(false); beep(2);
    var next = firstOpen();
    if (S.mode === 'work' && S.remaining > 0) {
      S.running = false; S.choosing = true;
      S.currentId = next ? next.id : null;
    } else {
      S.currentId = next ? next.id : null;
    }
    save(); paintAll();
  }

  function takeEarlyBreak() {
    S.choosing = false; S.mode = 'break'; S.remaining = S.brk * 60000; S.running = true; S.lastTick = Date.now(); S.curBreak = S.brk * 60000; S.lunch = false; tomatoRain();
    S.pomos++;
    save(); paintAll();
  }
  function continueNext() {
    S.choosing = false; S.running = true; S.lastTick = Date.now();
    save(); paintAll();
  }
  /* ---------- keep screen awake ---------- */
  var wakeOn = false, wakeLock = null;
  function paintWake(msg) {
    var b = $('#wakeBtn');
    b.setAttribute('aria-pressed', wakeOn ? 'true' : 'false');
    b.textContent = wakeOn ? 'המסך נשאר דלוק ✓' : 'השאר מסך דלוק';
    $('#wakeNote').textContent = msg || '';
  }
  function acquireWake() {
    if (!navigator.wakeLock) { wakeOn = false; paintWake('הדפדפן הזה לא תומך באפשרות הזו.'); return; }
    navigator.wakeLock.request('screen').then(function (l) {
      wakeLock = l;
      l.addEventListener('release', function () { if (wakeLock === l) wakeLock = null; });
      paintWake('');
    }).catch(function () {
      wakeOn = false; wakeLock = null;
      paintWake('לא הצלחתי להפעיל. ייתכן שהתצוגה הזאת חוסמת את זה. נסו לפתוח בלשונית רגילה בדפדפן.');
      save();
    });
  }
  function toggleWake() {
    if (wakeOn) {
      wakeOn = false;
      if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
      paintWake('');
    } else {
      wakeOn = true; paintWake(''); acquireWake();
    }
    save();
  }

  function startLunch(min) {
    min = Math.min(240, Math.max(0, Math.round(+min) || 0));
    if (!min) { $('#lunchCustom').focus(); return; }
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) {}
    if (S.running && S.mode === 'work') tick();
    S.lunchMin = min; S.lunch = true; S.choosing = false;
    S.mode = 'break'; S.curBreak = min * 60000; S.remaining = min * 60000;
    S.running = true; S.lastTick = Date.now();
    $('#lunchPanel').hidden = true;
    tomatoRain(); save(); paintAll();
  }
  function skipBreak() {
    S.mode = 'idle'; S.running = false; S.remaining = S.work * 60000; paintAll();
  }
  function resetTimer() {
    if (S.running) tick();
    S.mode = 'idle'; S.running = false; S.choosing = false; S.remaining = S.work * 60000;
    save(); paintAll();
  }

  /* ---------- tasks ---------- */
  function addTask() {
    var inp = $('#newTask'), v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    var t = { id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text: v, done: false, ms: 0, pri: +$('#newPri').value, due: $('#newDue').value || '' };
    S.tasks.push(t);
    inp.value = ''; inp.classList.remove('nudge');
    $('#newPri').value = '1'; $('#newDue').value = '';
    ensureCurrent(); save(); paintAll(); inp.focus();
  }
  function nudge() {
    var inp = $('#newTask'); inp.classList.add('nudge'); inp.focus();
    $('#current').textContent = 'הוסיפו משימה כדי להתחיל.';
  }
  function toggleDone(id) {
    var t = byId(id); if (!t) return;
    t.done = !t.done;
    if (t.done) { confetti(false); beep(1); }
    if (S.currentId === id && t.done) {
      var n = firstOpen(); S.currentId = n ? n.id : null;
    } else ensureCurrent();
    save(); paintAll();
  }
  function selectTask(id) {
    var t = byId(id); if (!t || t.done) return;
    if (S.running && S.mode === 'work') tick();
    S.currentId = id; save(); paintAll();
  }
  function delTask(id) {
    S.tasks = S.tasks.filter(function (t) { return t.id !== id; });
    ensureCurrent(); save(); paintAll();
  }

  /* ---------- painting ---------- */
  function paintTimer() {
    $('#digits').textContent = fmt(S.remaining, true);
    var pct = S.mode === 'idle' ? 0 : (1 - S.remaining / total()) * 100;
    $('#bar').style.width = Math.min(100, Math.max(0, pct)) + '%';
    document.title = S.mode === 'idle' ? 'זמן עבודה' : fmt(S.remaining, true) + ' · ' + (S.mode === 'break' ? 'הפסקה' : 'עבודה');
  }
  function paintTaskTime() {
    var c = byId(S.currentId);
    if (!c) return;
    var el = document.querySelector('[data-time="' + c.id + '"]');
    if (el) el.textContent = fmt(c.ms || 0);
  }
  function paintSummary() {
    var ms = S.tasks.reduce(function (a, t) { return a + (t.ms || 0); }, 0);
    $('#sTime').textContent = fmt(ms);
    $('#sDone').textContent = S.tasks.filter(function (t) { return t.done; }).length + '/' + S.tasks.length;
    $('#sPomo').textContent = S.pomos;
  }
  function paintList() {
    var ul = $('#list'); ul.textContent = '';
    if (!S.tasks.length) {
      var li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'עוד אין משימות. כתבו את הראשונה למעלה.';
      ul.appendChild(li); return;
    }
    sorted().forEach(function (t) {
      var li = document.createElement('li');
      li.className = 'task' + (t.done ? ' done' : '') + (t.id === S.currentId ? ' current' : '');
      var ck = document.createElement('button'); ck.className = 'check';
      ck.setAttribute('aria-label', t.done ? 'בטל סימון כהושלמה' : 'סמן כהושלמה');
      ck.setAttribute('aria-pressed', t.done ? 'true' : 'false');
      ck.innerHTML = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5l3.2 3.2L14 5.8"/></svg>';
      ck.onclick = function () { toggleDone(t.id); };
      var nm = document.createElement('button'); nm.className = 'name'; nm.textContent = t.text;
      nm.onclick = function () { selectTask(t.id); };
      if (t.id === S.currentId) nm.setAttribute('aria-current', 'true');
      var tm = document.createElement('span'); tm.className = 't'; tm.setAttribute('data-time', t.id); tm.textContent = fmt(t.ms || 0);
      var dl = document.createElement('button'); dl.className = 'del'; dl.setAttribute('aria-label', 'מחק משימה'); dl.textContent = '×';
      dl.onclick = function () { delTask(t.id); };
      var main = document.createElement('div'); main.className = 'main'; main.appendChild(nm);
      if (!t.done) main.appendChild(buildMeta(t));
      li.appendChild(ck); li.appendChild(main); li.appendChild(tm); li.appendChild(dl);
      ul.appendChild(li);
    });
  }
  function paintAll() {
    document.body.classList.toggle('is-break', S.mode === 'break');
    var label = S.mode === 'work' ? (S.running ? 'זמן עבודה' : 'בהשהיה') : S.mode === 'break' ? (S.lunch ? 'הפסקת צהריים' : 'הפסקה') : 'מוכנים להתחיל';
    $('#mode').textContent = label;
    $('#hero').hidden = S.mode !== 'break';
    var c = byId(S.currentId);
    var cur = $('#current'); cur.textContent = '';
    if (S.mode === 'break') cur.textContent = S.lunch ? 'בתיאבון! נחזור לעבודה בעוד קצת.' : 'קחו אוויר. נחזור למשימות בקרוב.';
    else if (c) { cur.appendChild(document.createTextNode('עכשיו: ')); var b = document.createElement('strong'); b.textContent = c.text; cur.appendChild(b); }
    else cur.textContent = S.tasks.length ? 'כל המשימות הושלמו. כל הכבוד!' : 'הוסיפו משימה כדי להתחיל.';
    var sb = $('#startBtn');
    sb.textContent = S.running ? 'השהה' : (S.mode === 'idle' ? 'התחל זמן עבודה' : 'המשך');
    sb.onclick = S.running ? pause : start;
    sb.disabled = S.choosing;
    $('#finishBtn').disabled = !c || S.mode === 'break' || S.choosing;
    $('#skipBtn').hidden = S.mode !== 'break';
    var ch = $('#choice'); ch.hidden = !S.choosing;
    if (S.choosing) {
      var mins = Math.max(1, Math.ceil(S.remaining / 60000));
      var nxt = byId(S.currentId);
      $('#choiceText').textContent = 'סיימתם מוקדם. נשארו עוד ' + mins + ' דקות בסבב. מה עושים?';
      $('#nextTask').hidden = !nxt;
      $('#nextTask').textContent = nxt ? 'להתחיל: ' + (nxt.text.length > 24 ? nxt.text.slice(0, 24) + '…' : nxt.text) : 'להתחיל את המשימה הבאה';
    }
    paintTimer(); paintList(); paintSummary();
    armEnd();
  }

  /* ---------- wiring ---------- */
  $('#finishBtn').onclick = finishTask;
  $('#resetBtn').onclick = resetTimer;
  $('#lunchBtn').onclick = function () { var p = $('#lunchPanel'); p.hidden = !p.hidden; };
  document.querySelectorAll('[data-lunch]').forEach(function (b) { b.onclick = function () { startLunch(b.getAttribute('data-lunch')); }; });
  $('#lunchGo').onclick = function () { startLunch($('#lunchCustom').value); };
  $('#wakeBtn').onclick = toggleWake;
  $('#sortBy').onchange = function () {
    S.sort = this.value;
    if (S.mode !== 'work') { var n = firstOpen(); if (n) S.currentId = n.id; }
    save(); paintAll();
  };
  $('#lunchCustom').addEventListener('keydown', function (e) { if (e.key === 'Enter') startLunch(this.value); });
  $('#skipBtn').onclick = skipBreak;
  $('#earlyBreak').onclick = takeEarlyBreak;
  $('#nextTask').onclick = continueNext;
  $('#addBtn').onclick = addTask;
  $('#newTask').addEventListener('keydown', function (e) { if (e.key === 'Enter') addTask(); });
  $('#newTask').addEventListener('input', function () { this.classList.remove('nudge'); });

  function applySettings() {
    var w = Math.min(120, Math.max(1, parseInt($('#workMin').value, 10) || 25));
    var b = Math.min(60, Math.max(1, parseInt($('#breakMin').value, 10) || 5));
    S.work = w; S.brk = b;
    if (S.mode === 'idle') S.remaining = w * 60000;
    save(); paintAll();
  }
  $('#workMin').onchange = applySettings;
  $('#breakMin').onchange = applySettings;

  $('#clearDone').onclick = function () {
    S.tasks = S.tasks.filter(function (t) { return !t.done; });
    ensureCurrent(); save(); paintAll();
  };
  var armed = false, armTimer = 0;
  $('#clearAll').onclick = function () {
    var b = this;
    if (!armed) {
      armed = true; b.textContent = 'בטוחים? לחצו שוב';
      armTimer = setTimeout(function () { armed = false; b.textContent = 'התחל יום חדש'; }, 3000);
      return;
    }
    clearTimeout(armTimer); armed = false; b.textContent = 'התחל יום חדש';
    S.tasks = S.tasks.filter(function (t) { return !t.done; }); S.currentId = null; ensureCurrent(); S.pomos = 0; S.mode = 'idle'; S.running = false; S.choosing = false; S.remaining = S.work * 60000;
    save(); paintAll();
  };

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    tick();
    if (wakeOn && !wakeLock) acquireWake();
  });
  addEventListener('beforeunload', function () { if (S.running) tick(); save(); });

  load();
  ensureCurrent();
  $('#workMin').value = S.work; $('#breakMin').value = S.brk; $('#lunchCustom').value = S.lunchMin || 45;
  $('#sortBy').value = S.sort || 'manual';
  if (S.wake) { wakeOn = true; acquireWake(); }
  paintWake();
  paintAll();
  try {
    var blob = new Blob(['setInterval(function(){postMessage(1)},500)'], { type: 'text/javascript' });
    var hb = new Worker(URL.createObjectURL(blob));
    hb.onmessage = function () { tick(); };
  } catch (e) {}
  setInterval(tick, 250);
})();
</script>
</body>
</html>
